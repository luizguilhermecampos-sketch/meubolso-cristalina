/* Estilos de segurança incorporados: não dependem da folha externa Leaflet. */
#real-map.leaflet-container{position:relative;overflow:hidden;outline:0;touch-action:pan-x pan-y;background:#dfeee7;isolation:isolate;}
#real-map .leaflet-pane,#real-map .leaflet-map-pane,#real-map .leaflet-tile-pane,#real-map .leaflet-overlay-pane,#real-map .leaflet-shadow-pane,#real-map .leaflet-marker-pane,#real-map .leaflet-tooltip-pane,#real-map .leaflet-popup-pane{position:absolute;left:0;top:0;}
#real-map .leaflet-map-pane{z-index:100;}
#real-map .leaflet-tile-pane{z-index:200;}
#real-map .leaflet-overlay-pane{z-index:400;}
#real-map .leaflet-shadow-pane{z-index:500;}
#real-map .leaflet-marker-pane{z-index:600;}
#real-map .leaflet-tooltip-pane{z-index:650;}
#real-map .leaflet-popup-pane{z-index:700;}
#real-map .leaflet-tile-container{position:absolute;left:0;top:0;pointer-events:none;}
#real-map .leaflet-tile,#real-map .leaflet-marker-icon,#real-map .leaflet-marker-shadow{position:absolute;left:0;top:0;max-width:none!important;max-height:none!important;user-select:none;-webkit-user-drag:none;}
#real-map .leaflet-tile{width:256px;height:256px;visibility:inherit;}
#real-map .leaflet-zoom-animated{transform-origin:0 0;}
#real-map .leaflet-zoom-hide{visibility:hidden;}
#real-map .leaflet-control-container{position:absolute;inset:0;z-index:800;pointer-events:none;}
#real-map .leaflet-top,#real-map .leaflet-bottom{position:absolute;z-index:1000;pointer-events:none;}
#real-map .leaflet-top{top:0;}#real-map .leaflet-bottom{bottom:0;}
#real-map .leaflet-left{left:0;}#real-map .leaflet-right{right:0;}
#real-map .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px;}
#real-map .leaflet-right .leaflet-control{float:right;}
#real-map .leaflet-control-zoom{border:2px solid #ffffff80;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px #0002;}
#real-map .leaflet-control-zoom a{display:block;width:31px;height:31px;line-height:31px;background:#fff;text-align:center;color:#18376c;text-decoration:none;font-size:22px;font-weight:bold;border-bottom:1px solid #ddd;}
#real-map .leaflet-control-attribution{font:10px/1.4 Arial,sans-serif;background:#fffd;padding:2px 5px;margin:0;max-width:100%;}
#real-map .leaflet-control-attribution a{color:#2472b7;}
#real-map .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px;}
#real-map .leaflet-popup-content-wrapper{background:#fff;border-radius:12px;box-shadow:0 4px 18px #0003;padding:10px;}
#real-map .leaflet-popup-content{margin:8px;min-width:165px;line-height:1.4;text-align:left;}
#real-map .leaflet-popup-tip-container{position:absolute;width:32px;height:16px;left:50%;bottom:-16px;overflow:hidden;margin-left:-16px;}
#real-map .leaflet-popup-tip{width:17px;height:17px;background:#fff;transform:rotate(45deg);margin:-9px auto 0;box-shadow:0 2px 10px #0002;}
#real-map .leaflet-popup-close-button{position:absolute;right:7px;top:4px;z-index:2;text-decoration:none;font-size:20px;color:#5c6474;}
#real-map .leaflet-interactive{cursor:pointer;}
#real-map .leaflet-overlay-pane svg{position:absolute;left:0;top:0;overflow:hidden;}
#real-map .leaflet-container img{max-width:none!important;}
#real-map .leaflet-fade-anim .leaflet-tile{will-change:opacity;}
#real-map .leaflet-tile-loaded{visibility:inherit;}
#map-state{padding-top:12px;line-height:1.5;font-size:12px;white-space:normal;overflow-wrap:anywhere;}

/* V5 — cartões e marcadores, inspirado em mapas de aplicativos de viagens */
#real-map{height:520px!important;border-radius:17px;background:#eaf2ec;overflow:hidden}
.map-columns{grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr)!important;align-items:start}
.map-toolbar .actions{gap:9px}
.store-results{max-height:545px;overflow:auto;padding-right:3px}
.store-result-card{width:100%;border:1px solid #e4ecf5;border-radius:14px;background:#fff;display:flex;align-items:center;gap:11px;padding:11px;margin:0 0 8px;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.store-result-card:hover,.store-result-card:focus{border-color:#7c46ef;background:#f8f5ff}
.store-logo{width:42px;height:42px;min-width:42px;display:grid;place-items:center;border-radius:13px;font-size:20px;color:white}
.store-result-title{display:block;font-weight:800;font-size:13px;color:#11246b}
.store-result-sub{display:block;font-size:11px;color:#7383a6;margin-top:4px}
.store-result-arrow{margin-left:auto;color:#7629ef;font-size:19px}
.map-marker{border:0!important;background:none!important;box-shadow:none!important}
.map-marker-pin{border:2px solid #fff;border-radius:15px;min-width:39px;height:39px;display:grid;place-items:center;box-shadow:0 3px 13px #15345f66;font-size:20px}
.map-marker-pin.selected{outline:3px solid #7032f5;transform:scale(1.12)}
.map-status-ok{color:#13835e;font-weight:750}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#667797;margin:10px 0 0}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
@media(max-width:1100px){.map-columns{grid-template-columns:1fr!important}}
@media(max-width:760px){#real-map{height:430px!important}.store-results{max-height:420px}}

/* MeuBolso V7: avaliações e administração */
.star-row{display:flex;gap:7px;align-items:center;margin:12px 0;flex-wrap:wrap}.star-button{border:0;background:#fff4d5;color:#b3b9c8;border-radius:11px;padding:10px;line-height:1}.star-button.on{background:#fff0bb;color:#efa300}.star-button svg{width:29px;height:29px}.review-card{background:#fafcff;border:1px solid #e7edfa;border-radius:13px;padding:14px;margin-top:10px}.review-meta{font-size:12px;color:#687a99;margin-bottom:9px}.review-stars{color:#e9a500;font-size:19px;letter-spacing:1px}.review-body{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.rating-bars{display:grid;gap:11px}.rating-line{display:grid;grid-template-columns:74px 1fr 42px;gap:12px;align-items:center;font-size:13px;font-weight:700}.rating-line .progress{margin:0;height:13px}.rating-line .progress i{background:linear-gradient(90deg,#ffcd28,#f59d06)}.login-note{color:#65769a;font-size:12px;line-height:1.5}.small-alert{background:#fff7e6;border:1px solid #ffe0a1;color:#7c580c;padding:12px;border-radius:11px;font-size:12px;line-height:1.5}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-actions button{width:auto}.admin-comments{max-height:640px;overflow:auto}.admin-tag{font-size:11px;color:#64759a}.admin-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.rating-note{font-size:12px;color:#687b9e}.star-label{font-size:12px;font-weight:800;color:#9a6a00}

</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon"><i data-lucide="wallet-cards"></i></div><div><strong>Meu<span>Bolso</span></strong><small>Cristalina</small></div></div><p class="tagline">Sua vida financeira também cresce aqui.</p><nav class="nav" id="nav"></nav><div class="side-bottom"><b>Cristalina GO</b><small>Educação financeira para um futuro maior.</small></div></aside><main class="main"><header class="topbar"><div class="app-top-title">MeuBolso Cristalina <span>• Seu controle financeiro</span></div><div class="topright"><i class="bell" data-lucide="bell" width="20"></i><span class="avatar" id="top-avatar"><i data-lucide="user-round"></i></span><span id="hello">Olá, visitante!</span></div></header><div id="page"></div><div class="footer">MeuBolso Cristalina · Dados da sua conta protegidos no Supabase</div></main></div><div class="toast" id="toast"></div><div id="auth-screen"><div class="auth-wrap"><div class="auth-shell" style="display:block;padding:32px;text-align:center"><h2>MeuBolso Cristalina</h2><p>Carregando a tela de acesso...</p></div></div></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), parseBR=v=>Number(String(v).replace(/[^\d,.-]/g,'').replace(',','.'))||0, today=()=>new Date().toISOString().slice(0,10), monthKey=()=>today().slice(0,7), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='meubolso_cristalina_v1'; const defaults={name:'Visitante',income:[],expenses:[],budgets:{Alimentação:500,Transporte:250,Lazer:200,Contas:250,Saúde:150,Mercado:150,Outros:100},goals:[],totalBudget:1500,monthlySaving:300,photo:null};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db={...defaults}};
let page='inicio',charts=[];const catIcons={Alimentação:'utensils',Transporte:'bus',Lazer:'gamepad-2',Contas:'file-text',Saúde:'heart-pulse',Mercado:'shopping-cart',Farmácia:'cross',Outros:'ellipsis'},catColors={Alimentação:'orange',Transporte:'blue',Lazer:'purple',Contas:'green',Saúde:'red',Mercado:'orange',Farmácia:'green',Outros:'purple'};
const navItems=[['inicio','house','Início'],['despesas','file-plus-2','Registrar despesa'],['receitas','chart-no-axes-column-increasing','Receitas'],['planejamento','calendar-days','Planejamento'],['lojas','map-pin','Mapa de lojas'],['relatorios','chart-column-increasing','Relatórios'],['metas','target','Metas'],['perfil','user-round','Perfil'],['avaliacoes','star','Avaliações'],['admin','shield-check','Administrador']];
const shops=[['Lanchonete Central','Alimentação','utensils','orange'],['Conveniência GO','Mercado','shopping-cart','blue'],['Restaurante Universitário','Alimentação','utensils','green'],['Mercadinho Cristal','Mercado','shopping-cart','purple'],['Farmácia Nossa Saúde','Saúde','cross','green'],['Outro estabelecimento','Outros','store','blue']];
function save(){scheduleCloudSave()}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3200)}function I(name){return `<i data-lucide="${name}"></i>`}function icon(name,color='blue'){return `<span class="ico ${color}">${I(name)}</span>`}function section(name,ico='chart-column-increasing',color='blue',extra=''){return `<div class="section-title"><div class="heading">${icon(ico,color)}<b>${name}</b></div>${extra}</div>`}function hero(a,b,desc){return `<div class="hero"><div><h1>${a}<br><em>${b}</em></h1><p>${desc}</p></div><div class="hero-quote">Pequenas escolhas hoje,<br> grandes conquistas amanhã! ☀</div></div>`}function kpi(name,val,ico,color,sub=''){return `<div class="card kpi">${icon(ico,color)}<div><small>${name}</small><strong>${val}</strong><span class="change">${sub}</span></div></div>`}function monthItems(arr){return arr.filter(x=>x.date?.slice(0,7)===monthKey())}function total(arr){return arr.reduce((s,x)=>s+Number(x.amount||0),0)}function current(){let inc=total(monthItems(db.income)),exp=total(monthItems(db.expenses));return {inc,exp,balance:inc-exp,remaining:Math.max(0,db.totalBudget-exp)}}function byCategory(){let o={};monthItems(db.expenses).forEach(x=>o[x.category]=(o[x.category]||0)+Number(x.amount));return o}function rows(arr,type){return arr.length?arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7).map(x=>`<div class="listrow"><div class="row-start">${icon(type==='expense'?(catIcons[x.category]||'shopping-cart'):'wallet',(catColors[x.category]||'green'))}<div><b>${esc(x.place||x.source||x.category)}</b><small>${esc(x.date)} · ${esc(x.category||x.kind||'Receita')}</small></div></div><div class="actions"><span class="amount ${type==='expense'?'negative':'positive'}">${type==='expense'?'- ':'+ '}${money(x.amount)}</span><button class="mini" data-delete="${type}:${x.id}" title="Excluir">${I('trash-2')}</button></div></div>`).join(''):'<div class="empty">Nenhum lançamento ainda. Cadastre o primeiro para começar.</div>'}function options(arr){return arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}function catSelect(){return Object.keys(db.budgets).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
function ensureBudgetCategories(){if(!db.budgets||typeof db.budgets!=='object')db.budgets={...defaults.budgets};}
function normalizedCategory(name){return String(name||'').trim().replace(/\s+/g,' ')}
function updateIcons(){if(window.lucide)lucide.createIcons()}
function render(){ensureBudgetCategories();charts.forEach(x=>x.destroy());charts=[];$('#nav').innerHTML=navItems.filter(([id])=>id!=='admin'||isMemberAdmin).map(([id,ico,text])=>`<button data-page="${id}" class="${page===id?'active':''}">${I(ico)} ${text}</button>`).join('');$('#hello').textContent='Olá, '+db.name.split(' ')[0]+'!';const topAvatar=$('#top-avatar');if(topAvatar)topAvatar.innerHTML=db.photo?`<img src="${db.photo}" alt="Foto do perfil">`:I('user-round');let fn={inicio:home,despesas:expenses,receitas:incomes,planejamento:planning,lojas:stores,relatorios:reports,metas:goals,perfil:profile,avaliacoes:feedbackView,admin:adminView}[page];$('#page').innerHTML=fn();updateIcons();drawCharts()}
function home(){let c=current(),cats=byCategory();return `${hero('Controle seus gastos e descubra','as melhores opções da cidade.','Mais organização, melhores escolhas e uma vida financeira mais tranquila em Cristalina.')}<div class="grid kpis">${kpi('Saldo do mês',money(c.balance),'wallet','blue','Receitas menos despesas')}${kpi('Despesas',money(c.exp),'chart-column-increasing','red','Gastos do mês')}${kpi('Receitas',money(c.inc),'trending-up','green','Entradas do mês')}${kpi('Quanto posso gastar',money(c.remaining),'coins','orange','Dentro do limite mensal')}</div><div class="grid two"><div class="card">${section('Registrar despesa','file-plus-2','purple')}<form id="quick-expense"><div class="field"><label>Estabelecimento</label><input name="place" required placeholder="Onde você comprou?"></div><div class="input-grid"><div class="field"><label>Categoria</label><select name="category">${catSelect()}</select></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0,00"></div></div><button class="primary wide">${I('save')} Salvar despesa</button></form></div><div class="card">${section('Lojas e conveniências','map-pin','green',`<button class="link" data-page="lojas">Ver todas →</button>`)}<div class="home-map-entry"><div class="ico green" style="margin:auto">${I('locate-fixed')}</div><h3>Encontre lojas perto de você</h3><p class="muted">Mapa real de Cristalina com estabelecimentos da região. Localização mediante permissão.</p><button class="primary" data-page="lojas">${I('map-pin')} Abrir mapa real</button></div></div></div><div class="grid three"><div class="card">${section('Gastos por categoria','chart-pie','blue')}<div class="chartbox"><canvas id="chartCats"></canvas></div></div><div class="card">${section('Planejamento mensal','calendar-days','green')}<h2>${money(c.exp)} <small class="muted">de ${money(db.totalBudget)}</small></h2><div class="progress"><i style="width:${Math.min(100,c.exp/(db.totalBudget||1)*100)}%"></i></div><p class="hint">${I('lightbulb')} Você ainda pode gastar ${money(c.remaining)} dentro do seu limite.</p><button class="secondary" data-page="planejamento">Planejar mês →</button></div><div class="card">${section('Meta de economia','target','orange')}<h2>${money(db.monthlySaving)}</h2><p class="muted">Valor que você deseja reservar neste mês.</p><div class="progress"><i style="width:50%;background:linear-gradient(90deg,#8c1aea,#cb68ff)"></i></div><p class="hint">Crie metas para acompanhar seus sonhos.</p><button class="secondary" data-page="metas">Minhas metas →</button></div></div><div class="grid two"><div class="card">${section('Dicas para consumir melhor','lightbulb','orange')}<div class="notice">Compare preços de itens equivalentes e defina quanto pode gastar por dia. Pequenos gastos frequentes podem fazer grande diferença.</div><div class="cat-grid" style="margin-top:12px">${Object.keys(db.budgets).slice(0,4).map(x=>`<button class="cat-tile" data-page="relatorios">${I(catIcons[x]||'tag')}${esc(x)}</button>`).join('')}</div></div><div class="card">${section('Últimas movimentações','list','blue')}<div class="list">${rows(db.expenses,'expense')}</div></div></div>`}
function expenses(){let c=current();return `${hero('Registre sua despesa com','rapidez e clareza.','Tenha mais controle do seu dinheiro e acompanhe seus gastos em Cristalina.')}<div class="grid kpis">${kpi('Saldo disponível',money(c.balance),'wallet','blue')}${kpi('Despesas do mês',money(c.exp),'chart-column-increasing','red')}${kpi('Orçamento restante',money(c.remaining),'chart-pie','green')}${kpi('Compras registradas',monthItems(db.expenses).length,'shopping-cart','orange')}</div><div class="grid two"><div class="card">${section('Nova despesa','file-plus-2','purple')}<form id="expense-form"><div class="input-grid"><div class="field full"><label>Estabelecimento *</label><input name="place" required list="shops" placeholder="Digite ou selecione um estabelecimento"></div><div class="field"><label>Categoria *</label><select name="category">${catSelect()}</select></div><div class="field"><label>Valor (R$) *</label><input name="amount" type="number" required min="0.01" step="0.01" placeholder="0,00"></div><div class="field"><label>Data da compra</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Pagamento</label><select name="payment">${options(['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Outro'])}</select></div><div class="field full"><label>Observação (opcional)</label><textarea name="note" placeholder="O que você comprou?" rows="3"></textarea></div></div><button class="primary wide">${I('save')} Salvar despesa</button></form></div><div class="card">${section('Últimas despesas cadastradas','clock','blue')}<div class="list">${rows(db.expenses,'expense')}</div><div class="hint">💡 Anotar os pequenos gastos é um dos melhores primeiros passos para reconhecer seus hábitos de consumo.</div></div></div><div class="card">${section('Categorias rápidas','tags','purple')}<div class="cat-grid">${Object.keys(db.budgets).map(x=>`<button class="cat-tile" data-cat="${x}">${I(catIcons[x]||'tag')}${esc(x)}</button>`).join('')}</div></div>`}
function incomes(){let c=current();return `${hero('Organize suas receitas e','entenda sua renda.','Registre fontes de renda, acompanhe sua evolução e planeje seu futuro.')}<div class="grid kpis">${kpi('Salário e recebimentos',money(c.inc),'briefcase-business','green')}${kpi('Total recebido no mês',money(c.inc),'coins','blue')}${kpi('Resultado do mês',money(c.balance),'chart-column-increasing','purple')}${kpi('Receitas registradas',monthItems(db.income).length,'calendar-days','orange')}</div><div class="grid two"><div class="card">${section('Registrar nova receita','wallet','purple')}<form id="income-form" class="input-grid"><div class="field"><label>Origem da receita</label><input name="source" required placeholder="Salário, freela, comissão..."></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data do recebimento</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Tipo de receita</label><select name="kind">${options(['Fixa','Variável'])}</select></div><div class="field full"><label>Observações</label><input name="note" placeholder="Opcional"></div><div class="full"><button class="primary wide">${I('plus')} Registrar receita</button></div></form></div><div class="card">${section('Evolução das receitas','chart-no-axes-column-increasing','green')}<div class="chartbox"><canvas id="chartIncome"></canvas></div></div></div><div class="grid two"><div class="card">${section('Fontes de renda','chart-pie','orange')}<div class="chartbox"><canvas id="chartSources"></canvas></div></div><div class="card">${section('Últimas receitas registradas','list','blue')}<div class="list">${rows(db.income,'income')}</div></div></div>`}
function planning(){let c=current(),cats=byCategory();return `${hero('Planeje seu mês e','controle seus limites.','Crie, renomeie ou remova categorias e mantenha todo o aplicativo sincronizado.')}<div class="grid kpis">${kpi('Orçamento total',money(db.totalBudget),'wallet','purple')}${kpi('Já utilizado',money(c.exp),'chart-column-increasing','red')}${kpi('Disponível para gastar',money(c.remaining),'wallet-cards','green')}${kpi('Meta de economia',money(db.monthlySaving),'target','orange')}</div><div class="grid planning-layout"><div class="card">${section('Orçamento por categoria','chart-pie','blue')}<p class="muted">Valores atualizados com os gastos registrados em todas as abas.</p><div id="budget-draft-status" class="muted" aria-live="polite"></div><div id="budgets">${Object.entries(db.budgets).map(([name,limit])=>{let spent=cats[name]||0;return `<div class="budget-row"><div class="info"><strong>${esc(name)}</strong><span>${money(spent)} de ${money(limit)} · ${limit?Math.round(spent/limit*100):0}%</span></div><div class="progress"><i style="width:${Math.min(100,limit?spent/limit*100:0)}%;background:${spent>limit?'#ff345c':'linear-gradient(90deg,#087afd,#9d24f9)'}"></i></div></div>`}).join('')}</div></div><div class="card">${section('Configurar orçamento','calendar-days','purple')}<form id="budget-form"><div class="budget-top-grid"><div class="field"><label>Limite total do mês (R$)</label><input name="totalBudget" type="number" step="0.01" min="0" value="${db.totalBudget}"></div><div class="field"><label>Meta de economia mensal (R$)</label><input name="monthlySaving" type="number" step="0.01" min="0" value="${db.monthlySaving}"></div></div><div class="budget-edit-heading"><h3>Suas categorias</h3><span class="muted">Edite nome e limite, ou exclua uma categoria</span></div><div class="budget-editor-list">${Object.entries(db.budgets).map(([name,val],i)=>`<div class="budget-edit-row"><div class="field"><label>Categoria</label><input name="cat_name_${i}" value="${esc(nam function drawCharts(){function chart(id,type,labels,values,colors){let el=document.getElementById(id);if(!el||!window.Chart)return;charts.push(new Chart(el,{type,data:{labels,datasets:[{label:'Valor (R$)',data:values,backgroundColor:colors||['#ff872b','#156ef7','#9235f6','#00c67c','#ffd146','#ff345c'],borderColor:'#0b73ef',borderWidth:type==='line'?3:0,fill:type==='line',tension:.35,borderRadius:type==='bar'?5:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut',position:'bottom',labels:{boxWidth:11,font:{size:10}}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}}))}let cats=byCategory(),ks=Object.keys(cats),vs=Object.values(cats);chart('chartCats','doughnut',ks.length?ks:['Sem gastos'],vs.length?vs:[1]);chart('chartReportCats','doughnut',ks.length?ks:['Sem gastos'],vs.length?vs:[1]);let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});chart('chartIncome','bar',months.map(x=>x.slice(5)+'/'+x.slice(0,4)),months.map(x=>total(db.income.filter(y=>y.date?.startsWith(x)))),'#8c29f8');chart('chartSources','doughnut',[...new Set(db.income.map(x=>x.source))].slice(0,8),[...new Set(db.income.map(x=>x.source))].slice(0,8).map(s=>total(db.income.filter(x=>x.source===s))));if($('#chartDaily'))updateReports()}
function updateReports(){let m=$('#report-month')?.value||monthKey(),items=db.expenses.filter(x=>x.date?.startsWith(m));let daily={},places={};items.forEach(x=>{daily[x.date]=(daily[x.date]||0)+Number(x.amount);places[x.place]=(places[x.place]||0)+Number(x.amount)});const old=charts.filter(x=>['chartDaily','chartPlaces'].includes(x.canvas.id));old.forEach(x=>{x.destroy();charts.splice(charts.indexOf(x),1)});if(!window.Chart)return;function add(id,type,obj){let el=$('#'+id);if(!el)return;let labels=Object.keys(obj),data=Object.values(obj);charts.push(new Chart(el,{type,data:{labels,datasets:[{data,label:'Gastos (R$)',borderColor:'#0877fa',backgroundColor:type==='bar'?'#9233ed':'#0877fa35',tension:.35,fill:true,borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{ticks:{maxRotation:45,font:{size:9}}}}}}))}add('chartDaily','line',Object.fromEntries(Object.entries(daily).sort()));add('chartPlaces','bar',Object.fromEntries(Object.entries(places).sort((a,b)=>b[1]-a[1]).slice(0,6)));let highest=Object.entries(byCategory()).sort((a,b)=>b[1]-a[1])[0];if($('#insights'))$('#insights').innerHTML=`<div class="notice">${I('lightbulb')} ${highest?`Sua maior categoria neste mês é <b>${esc(highest[0])}</b>, com ${money(highest[1])}.`:'Registre suas despesas para receber análises personalizadas.'}</div><div class="notice">As informações apresentadas são calculadas com base nos dados que você cadastrou.</div>`;updateIcons()}

const placeTypes={restaurant:['Alimentação','utensils','orange'],fast_food:['Alimentação','sandwich','orange'],cafe:['Alimentação','coffee','orange'],bar:['Alimentação','coffee','orange'],pub:['Alimentação','coffee','orange'],ice_cream:['Alimentação','ice-cream-cone','orange'],supermarket:['Mercado','shopping-cart','purple'],convenience:['Mercado','shopping-basket','purple'],greengrocer:['Mercado','shopping-basket','purple'],bakery:['Alimentação','croissant','orange'],pharmacy:['Saúde','pill','green'],hospital:['Saúde','cross','green'],clinic:['Saúde','cross','green'],fuel:['Postos','fuel','blue']};

function updateStores(){const el=$('#shop-results');if(!el)return;const q=($('#shop-search')?.value||'').toLocaleLowerCase('pt-BR'), category=$('#shop-cat')?.value||'';const data=foundPlaces.filter(p=>p.name.toLocaleLowerCase('pt-BR').includes(q)&&(!category||classifyPlace(p.tags)[0]===category));const colors={orange:'#f4931c',green:'#00b878',purple:'#8138ef',blue:'#1476f3'};const emoji={orange:'🍽️',green:'💊',purple:'🛒',blue:'🏬'};el.innerHTML=data.length?`<div class="map-note" style="margin:0 0 10px">${data.length} locais nesta seleção</div>`+data.slice(0,200).map(p=>{let [cat,ico,color]=classifyPlace(p.tags);return `<button class="store-result-card" data-focus-place="${p.index}"><span class="store-logo" style="background:${colors[color]||colors.blue}">${emoji[color]||emoji.blue}</span><span><span class="store-result-title">${esc(p.name)}</span><span class="store-result-sub">${esc(cat)} · ${Math.round(p.distance)} m em linha reta</span></span><span class="store-result-arrow">›</span></button>`}).join(''):'<div class="empty">Nenhum local corresponde ao filtro. Experimente outra categoria ou mova o mapa.</div>';updateIcons()}
function distanceMeters(a,b,c,d){let rad=Math.PI/180,dx=(c-a)*rad,dy=(d-b)*rad,A=Math.sin(dx/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dy/2)**2;return 12742000*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))}

function initRealMap(){if(page!=='lojas'||!$('#real-map'))return;if(!window.L){setMapState('Não foi possível carregar a biblioteca de mapas. Verifique a conexão.');return}if(realMap){realMap.remove();realMap=null}realMap=L.map('real-map',{zoomControl:true,preferCanvas:true}).setView(centerCristalina,15);
const base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Source: Esri, OpenStreetMap contributors and other contributors'}).addTo(realMap);

async function fetchNearby(){if(!realMap||page!=='lojas')return;const num=++mapRequestCounter;const pos=realMap.getCenter(),lat=pos.lat,lon=pos.lng;
// Área limitada para preservar desempenho e respeitar os servidores comunitários.
const b=realMap.getBounds(),south=Math.max(b.getSouth(),lat-.025),north=Math.min(b.getNorth(),lat+.025),west=Math.max(b.getWest(),lon-.025),east=Math.min(b.getEast(),lon+.025);
const bbox=[south,west,north,east].join(',');const query=`[out:json][timeout:24];(nwr["name"]["amenity"~"^(restaurant|fast_food|cafe|bar|pub|ice_cream|pharmacy|hospital|clinic|fuel|bank|atm|marketplace|car_wash|dentist|veterinary|post_office)$"](${bbox});nwr["name"]["shop"](${bbox}););out center 450;`;
setMapState('Consultando estabelecimentos cadastrados na região...');
try{let data=null,lastError=null;for(const endpoint of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter']){try{const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),15000);let resp;try{resp=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:query}),headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','Accept':'application/json'},signal:ctrl.signal,mode:'cors'})}finally{clearTimeout(timeout)}if(!resp.ok)throw new Error('HTTP '+resp.status);data=await resp.json();if(!Array.isArray(data.elements))throw new Error('Resposta inválida');break}catch(e){lastError=e}}if(!data)throw lastError||new Error('Sem resposta');if(num!==mapRequestCounter||page!=='lojas')return;
const unique=new Set();foundPlaces=data.elements.map(x=>({name:(x.tags?.name||'').trim(),lat:x.lat??x.center?.lat,lon:x.lon??x.center?.lon,tags:x.tags||{},id:x.type+':'+x.id})).filter(x=>x.name&&Number.isFinite(x.lat)&&Number.isFinite(x.lon)).filter(x=>{let k=x.name.toLocaleLowerCase('pt-BR')+'|'+x.lat.toFixed(4)+'|'+x.lon.toFixed(4);if(unique.has(k))return false;unique.add(k);return true}).map(x=>({...x,distance:distanceMeters(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.distance-b.distance).map((x,i)=>({...x,index:i}));
placeLayer.clearLayers();const colors={orange:'#f4931c',green:'#00b878',purple:'#8138ef',blue:'#1476f3'};const emoji={orange:'🍽️',green:'💊',purple:'🛒',blue:'🏬'};
foundPlaces.forEach(p=>{const [cat,iconName,color]=classifyPlace(p.tags);const safeColor=colors[color]||colors.blue;const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'map-marker',html:`<span class="map-marker-pin" style="background:${safeColor}">${emoji[color]||emoji.blue}</span>`,iconSize:[40,42],iconAnchor:[20,40]})}).addTo(placeLayer);p.marker=marker;const node=document.createElement('div');node.className='popup-place';const title=document.createElement('strong');title.textContent=p.name;const sub=document.createElement('p');sub.textContent=cat;const btn=document.createElement('button');btn.className='primary';btn.textContent='Registrar despesa';btn.onclick=()=>selectRealPlace(p.index);node.append(title,sub,btn);marker.bindPopup(node)});
updateStores();setMapState(foundPlaces.length?`${foundPlaces.length} estabelecimentos encontrados. Toque nos ícones ou escolha na lista.`:'Nenhum estabelecimento cadastrado nesta área na fonte consultada. Mova o mapa ou tente outra região.');
}catch(err){if(num!==mapRequestCounter||page!=='lojas')return;foundPlaces=[];placeLayer?.clearLayers();const box=$('#shop-results');if(box)box.innerHTML='<div class="empty"><strong>Consulta gratuita temporariamente indisponível.</strong><p>O mapa continua disponível. Tente novamente em alguns minutos ou registre uma despesa manualmente.</p></div>';setMapState('A API comunitária Overpass não respondeu: '+err.message+'. Nenhuma loja foi inventada.')}}

function id(){return String(Date.now())+Math.random().toString(16).slice(2,7)}function formData(f){return Object.fromEntries(new FormData(f).entries())}function addExpense(f){let x=formData(f);if(!x.place?.trim()||!(Number(x.amount)>0)){toast('Informe estabelecimento e valor válido.');return}db.expenses.push({...x,id:id(),date:x.date||today(),amount:Number(x.amount)});save();render();toast('Despesa registrada!')}function addIncome(f){let x=formData(f);if(!x.source?.trim()||!(Number(x.amount)>0)){toast('Informe uma origem e valor válido.');return}db.income.push({...x,id:id(),date:x.date||today(),amount:Number(x.amount)});save();render();toast('Receita registrada!')}

function photoToJpeg(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type))return reject(new Error('Selecione JPG, PNG ou WebP.'));if(file.size>6*1024*1024)return reject(new Error('A imagem deve ter no máximo 6 MB.'));const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,360/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))}catch(err){reject(err)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Não foi possível ler a foto.'))};img.src=url})}
document.addEventListener('change',async e=>{if(e.target.id!=='profile-photo-input')return;const file=e.target.files?.[0];if(!file)return;try{const previous=db.photo;db.photo=await photoToJpeg(file);try{save()}catch(error){db.photo=previous;throw new Error('Armazenamento cheio. Use outra foto menor.')}render();toast('Foto do perfil atualizada!')}catch(error){toast(error.message)}});

function setMemberSession(s){memberSession=s;memberId=s?.user?.id||null;if(s)sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));else sessionStorage.removeItem(SESSION_KEY);}
async function memberAuthRequest(path,method='POST',body){let response=await fetch(SUPABASE_URL+path,{method,headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.msg||result.error_description||result.message||'Falha na autenticação');return result}
async function tokenReady(){if(!memberSession)throw Error('Sessão não iniciada.');if(Date.now()<((memberSession.expires_at||0)*1000-60000))return memberSession.access_token;if(!memberSession.refresh_token)throw Error('Sessão expirada. Entre novamente.');const refreshed=await memberAuthRequest('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:memberSession.refresh_token});setMemberSession(refreshed);return refreshed.access_token}
async function memberDb(method='GET',body){const token=await tokenReady();const response=await fetch(SUPABASE_URL+'/rest/v1/member_finances'+(method==='GET'?'?select=data&limit=1':'?on_conflict=user_id'),{method,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(method==='POST'?{Prefer:'resolution=merge-duplicates,return=minimal'}:{})},body:body?JSON.stringify(body):undefined});if(!response.ok)throw Error('Banco de dados: '+response.status+' '+(await response.text()).slice(0,160));return method==='GET'?response.json():null}
function scheduleCloudSave(){if(!memberReady||!memberId)return;const version=memberVersion, owner=memberId,payload=JSON.stringify(db);clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>{lastCloudSave=lastCloudSave.catch(()=>{}).then(async()=>{if(memberId!==owner||memberVersion!==version)return;try{await memberDb('POST',{user_id:owner,data:JSON.parse(payload),updated_at:new Date().toISOString()});document.getElementById('cloud-status')?.replaceChildren(document.createTextNode('Dados sincronizados'));}catch(e){let status=document.getElementById('cloud-status');if(status)status.textContent='Falha ao sincronizar. Confira sua conexão e salve novamente.';console.error(e);}})},700)}
async function loadMember(){memberReady=false;const owner=memberId,version=++memberVersion;try{const result=await memberDb('GET');if(memberId!==owner||version!==memberVersion)return;db={...CLOUD_DEFAULTS(),...(result?.[0]?.data||{})};page='inicio';memberReady=true;authRoot().innerHTML='';document.querySelector('.app').style.display='flex';await checkAdmin();render();const top=document.querySelector('.topright');if(top&&!document.getElementById('member-logout'))top.insertAdjacentHTML('beforeend','<button id="member-logout" class="secondary" type="button">Sair</button>');const footer=document.querySelector('.footer');if(footer)footer.innerHTML='<span id="cloud-status">Conta privada · Sincronização ativada</span>';if(!result?.length)scheduleCloudSave();}catch(e){memberReady=false;authPage('login');authAlert('Não foi possível carregar sua conta: '+e.message)}}
async function memberLogin(form){if(memberBusy)return;memberBusy=true;const mode=form.dataset.mode, email=form.elements.email.value.trim();const btn=form.querySelector('button[type=submit]');btn.disabled=true;authAlert('Aguarde...');try{if(mode==='forgot'){await memberAuthRequest('/auth/v1/recover','POST',{email});authAlert('Se o e-mail estiver cadastrado, você receberá instruções de recuperação.');return}if(mode==='register'){const pw=form.elements.password.value;if(pw!==form.elements.confirm.value)throw Error('As senhas não coincidem.');const result=await memberAuthRequest('/auth/v1/signup','POST',{email,password:pw,data:{full_name:form.elements.name.value.trim()}});if(result.access_token&&result.user){setMemberSession(result);await loadMember();return}authAlert('Cadastro enviado! Confira seu e-mail para confirmar a conta e depois faça login.');return}const result=await memberAuthRequest('/auth/v1/token?grant_type=password','POST',{email,password:form.elements.password.value});if(!result.access_token||!result.user)throw Error('Não foi possível validar o acesso.');setMemberSession(result);await loadMember()}catch(e){authAlert(e.message)}finally{memberBusy=false;if(btn.isConnected)btn.disabled=false}}
async function memberLogout(){clearTimeout(cloudSaveTimer);try{await lastCloudSave}catch{}memberReady=false;memberVersion++;setMemberSession(null);isMemberAdmin=false;reviewOwn=null;selectedStars=0;adminRows=[];adminSummary=null;db=CLOUD_DEFAULTS();page='inicio';document.getElementById('member-logout')?.remove();authPage('login')}
async function bootAuth(){if(!cloudEnabled()){authPage('login');return}authPage('login');let session;try{session=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')}catch{}if(session?.refresh_token){setMemberSession(session);await loadMember()}}
document.addEventListener('submit',e=>{if(e.target.id==='member-auth-form'){e.preventDefault();memberLogin(e.target)}});
document.addEventListener('click',e=>{const mode=e.target.closest('[data-auth-mode]');if(mode)authPage(mode.dataset.authMode);if(e.target.closest('#member-logout'))memberLogout()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b?.dataset.page==='avaliacoes')loadOwnReview()});
const priorMemberRender=render;
render=function(){if(!memberReady||!memberId)return;if(page==='admin'&&!isMemberAdmin)page='inicio';priorMemberRender();const logout=document.getElementById('member-logout');if(!logout){document.querySelector('.topright')?.insertAdjacentHTML('beforeend','<button id="member-logout" class="secondary" type="button">Sair</button>')}};

window.addEventListener('DOMContentLoaded',()=>{bootAuth().catch(error=>{console.error('Falha ao iniciar cadastro:',error);document.querySelector('.app').style.display='none';document.getElementById('auth-screen').innerHTML='<div class="auth-wrap"><div class="auth-shell" style="display:block;padding:30px;text-align:center"><h2>Não foi possível iniciar a tela de acesso.</h2><p>Atualize a página ou tente outro navegador.</p></div></div>';});});
</script></body></html>
